# /etc/nginx/sites-available/r5-riverview - Camrui 192.168.1.155
# Existing HTTPS listener on 443 routes to backends
# Port 18304 NEW - R5 lean dashboard - bind 127.0.0.1:18304

# Existing backends (keep)
# 18303 Python website backend existing
# 18311 Python backend existing

# NEW R5 backend
upstream r5_backend {
    server 127.0.0.1:18304;
}

server {
    listen 443 ssl;
    server_name 192.168.1.155;
    # ssl certs existing - keep your existing cert paths
    
    # Existing routes - keep as is
    # location / { proxy_pass http://127.0.0.1:18303; } # example existing
    # location /api/ { proxy_pass http://127.0.0.1:18311; }

    # NEW R5 - Riverview 5 Lean Estate OS
    location /r5/ {
        proxy_pass http://r5_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket for /r5/ws live estate status
    }

    location /r5-ws {
        proxy_pass http://r5_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Optional: direct subdomain for R5 if you want riverview.192.168.1.155
    # server_name r5.192.168.1.155; location / { proxy_pass http://r5_backend; }
}

# Security: 18304 NOT exposed directly - only via 443 proxy
# Firewall: sudo ufw deny 18304 / iptables -A INPUT -p tcp --dport 18304 -s 127.0.0.1 -j ACCEPT, then DROP others
