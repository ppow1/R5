<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>R3A Steward sign in · Riverview</title>
  <style>
    :root{font:16px system-ui,sans-serif;color:#edf4fc;background:#091522;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:clamp(16px,4vw,40px);background:radial-gradient(ellipse at top,#1b3853,#091522 62%)}
    main{width:min(520px,100%);margin:6vh auto}
    h1{font-size:clamp(1.55rem,4vw,2rem);margin:.2rem 0}
    p{color:#c8d9ea;line-height:1.5}
    form{margin-top:24px;padding:22px;border:1px solid #9dbce544;border-radius:14px;background:#102238aa}
    label{display:block;margin:16px 0 6px;font-weight:600}
    input,select{width:100%;min-height:44px;padding:10px 12px;border:1px solid #9dbce577;border-radius:8px;background:#071421;color:#edf4fc;font:inherit}
    button{width:100%;min-height:46px;margin-top:22px;padding:10px 16px;border:1px solid #9dbce577;border-radius:9px;background:#244566;color:#fff;font:inherit;cursor:pointer}
    :focus-visible{outline:3px solid #acd3ff;outline-offset:2px}
    #status{min-height:1.5em;color:#d6c79a}
    .small{font-size:.86rem;color:#abc0d4}
    a{color:#acd3ff}
  </style>
</head>
<body>
<main>
  <h1>R3A Steward sign in</h1>
  <p>This account and session belong to R3 Alpha. Sign in here to continue to Riverview.</p>
  <form id="login-form" autocomplete="on">
    <label for="intent">Action</label>
    <select id="intent" name="intent">
      <option value="login">Sign in</option>
      <option value="enroll">First enrollment</option>
      <option value="recover">Credential recovery</option>
    </select>
    <label for="login-name">Steward sign-in name</label>
    <input id="login-name" name="login_name" type="text" minlength="3" maxlength="254" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="1" maxlength="1024" autocomplete="current-password" required>
    <div id="challenge-field" hidden>
      <label for="challenge">One-time enrollment or recovery code</label>
      <input id="challenge" name="challenge" type="password" minlength="32" maxlength="128" autocomplete="off">
      <p class="small">Enter the one-time code delivered through the approved private channel.</p>
    </div>
    <button id="submit" type="submit">Sign in to R3A</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <p><a href="/steward">Return to Riverview</a></p>
</main>
<script src="/web/steward-login.js" defer></script>
</body>
</html>
